# The real cell as measured (AI-Robotics-V2 D16). A record: do not edit it to
# track design changes; derive a new layout with `extends:` instead.
schema: rsf.layout/1
name: as_built
description: >-
  Measured real cell. Robot origin 0.6765 m. The reachability sweep
  (AI-Robotics-V2 findings/04) services 35 of 37 slots: outgoing/L3/C0 and
  outgoing/L3/C5 are out of the workspace at insert and lift.

plugins: [../plugin/tm_tray]

# Cell process parameters, read by the TM skills (P3) and checks.
process:
  standoff_far: 0.35      # far AprilGrid read, camera to label (m)
  standoff_near: 0.2768   # near read; plate-free standoff (D24, D28)
  carry_tilt_deg: 15.0    # plate tilt while carrying, degrees: insurance on top of the push
                          # (user 2026-11-12); D14's design value.
  # withdraw -> carry is one motion: tilt about `pivot` (flange y, z at withdraw)
  # while backing out `retreat`; the flange only goes down and back (user
  # 2026-11-13), and every obstacle stays `clearance` away along the whole motion
  # (user 2026-11-13: >= 10 mm). Least displacement passing every slot of all
  # three layouts: cells/tm_tray/tools/tune_tilt.py (2026-11-13): flange 11.6 mm
  # (11.4 down, 1.9 back). At its start (withdraw) the carried tray is exactly
  # 10.0 mm above its jig's front columns, which the lift height (D28) sets.
  tilt_motion: {pivot: [0.12, 0.06], retreat: 0.035, samples: 16, clearance: 0.010}
  jaw_operating_range: {min: 0.0210, max: 0.06085}   # assets/asset_spec.yaml
  # The fixed push plate (user 2026-11-12). Pick: insert stops `margin` before
  # the plate meets a tray placed `place_offset` shallow, then the arm pushes the
  # tray (jaws open) until it is `overtravel` past its seat and registered
  # against the plate. Place: set down `place_offset` shallower than the seat.
  # margin 2 mm until the real plate is measured (docs/p2_results.md);
  # overtravel and place_offset are AI-Robotics-V2 D30's 2 mm.
  push_plate: {geometry: air_cylinder_plate, margin: 0.002, overtravel: 0.002, place_offset: 0.002}

entities:
  floor:
    generator: rsf.box
    params: {size: [6.0, 6.0, 0.1], pose: {xyz: [0.0, 0.0, -0.05]}, tags: [floor]}

  pedestal:
    generator: tm_tray.pedestal
    params:
      base_size: 0.1765
      leg_height: 0.47
      plate_thickness: 0.03
      base_yaw_deg: 180.0          # D30: the arm stands half a turn round

  incoming:
    generator: tm_tray.rack
    params:
      role: incoming
      approach: [1.0, 0.0, 0.0]
      face_distance: 0.792
      width: 0.800
      depth: 0.308
      layer_heights: [0.82, 1.07, 1.32]
      n_jigs: 4
      plane_thickness: 0.020
      cylinder_radius: 0.020
      jig_gap: 0.016

  outgoing:
    generator: tm_tray.rack
    params:
      role: outgoing
      approach: [-1.0, 0.0, 0.0]
      face_distance: 0.792
      width: 1.160
      depth: 0.308
      layer_heights: [0.55, 0.80, 1.05, 1.30]
      n_jigs: 6
      plane_thickness: 0.020
      cylinder_radius: 0.020
      jig_gap: 0.016

  table:
    generator: tm_tray.table
    params:
      face_distance: 0.85
      height: 0.7
      depth: 0.36
      jig_x: 0.0
      approach: [0.0, 1.0, 0.0]
      plane_thickness: 0.020
      confirmed: false             # generator defaults, not measured

placements:
  jig:
    urdf: ../assets/tray_jig_with_label/tray_jig_with_label.urdf
    at: {kind: slot}

objects:
  tray:
    urdf: ../assets/tray/tray.urdf
    at: {kind: slot}
    offset: {xyz: [0.0, 0.0, 0.035]}   # rails on the jig column tops (JIG_COL_TOP)
    initially: all

robot:
  urdf: ../assets/tm5s_egu50.urdf
  base: {feature: pedestal/arm_base}
  tool_frame: flange
