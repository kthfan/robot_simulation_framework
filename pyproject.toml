[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsf"
version = "0.0.1"
description = "Robot simulation framework: cell model -> teach points -> paths -> simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
mesh = ["trimesh>=4"]
mujoco = ["mujoco>=3.2"]
usd = ["usd-core>=24", "trimesh>=4"]          # author the Isaac stage (rsf.compile.usd)
isaac = ["isaacsim[all,extscache]>=5"]       # run it: Python 3.12 (6.x), RTX GPU, --extra-index-url https://pypi.nvidia.com
eaik = ["eaik @ git+https://github.com/kthfan/EAIK.git@v1.2.2+robust.1", "motion_planner @ git+https://github.com/kthfan/robot_arm_motion_planner.git", "urchin"]
collision = ["coal>=3", "trimesh>=4"]
curobo = []  # installed from kthfan/curobo dev/main; GPU only
live = ["aiortc>=1.9"]                       # WebRTC video for the live view (--live-webrtc); the rest is stdlib
test = ["pytest>=8", "trimesh>=4", "coal>=3", "mujoco>=3.2", "usd-core>=24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rsf.live" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "gpu: needs CUDA (run on Kaggle)",
    "slow: long-running",
]
