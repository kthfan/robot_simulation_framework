[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsf"
version = "0.0.1"
description = "Robot simulation framework: cell model -> teach points -> paths -> simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
mesh = ["trimesh>=4"]
mujoco = ["mujoco>=3.2"]
eaik = ["eaik @ git+https://github.com/kthfan/EAIK.git@v1.2.2+robust.1", "motion_planner @ git+https://github.com/kthfan/robot_arm_motion_planner.git", "urchin"]
collision = ["coal>=3", "trimesh>=4"]
curobo = []  # installed from kthfan/curobo dev/main; GPU only
test = ["pytest>=8", "trimesh>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: needs CUDA (run on Kaggle)",
    "slow: long-running",
]
